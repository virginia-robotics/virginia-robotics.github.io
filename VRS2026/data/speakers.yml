- name: Gregory Stein
  affiliation: George Mason University
  website: https://people.cs.gmu.edu/~gjstein/
  image: img/people/stein.jpg
  talk: "Anticipatory Planning: Integrating Learning and Planning to Enable More Forward-Thinking Long-Lived Mobile Robots"
  abstract: |
    The next generation of household robots will be long-lived, operating over deployments lasting hours or days. However, most mobile robots are problematically myopic: existing robot task planning strategies typically focus only on completing an immediate objective as quickly as possible, yet since the environment persists, such strategies often render the environment more difficult to use as time goes on and introduce side effects that impede later tasks. Instead, if robots are to enter homes or hospitals and act as assistive companions over lengthy deployments, they must strive to maximize their long-lived utility and so must have the capacity to interleave quick, reliable, and unobtrusive completion of their assigned objectives with proactive action, preparation for future tasks, and maintenance of the long-term usability of the environment, an aim for which myopic planning is insufficient.

    In this talk, I will discuss my lab's recent progress towards what we call anticipatory planning, in which estimates of expected future cost—the expected impact of the robot's actions on the uncertain future—to inform planning to guide the robot towards proactive and forward-looking behaviors that jointly prioritize long-term usability of the environment with execution of its assigned objectives. I will showcase both completed and ongoing work that shows the potential of this approach to enable more capable and effective long-lived mobile robots and speculate on the broad future of this line of research.

- name: Noel Naughton
  affiliation: Virginia Tech
  website: https://naughtonlab.org/
  image: img/people/naughton.jpg
  talk: "Embedding biological intelligence into soft robots"
  abstract: "Robotics cannot yet match the dexterity and agility of animals. This is particularly true in the realm of soft robotics. While biological inspiration comes from the incredible potential of octopus arms and elephant trunks, current soft robot implementations struggle to perform basic useful tasks. This talk will explore how incorporating lessons from biology can help us improve the design and control and soft robots in situations where traditional approaches struggle. With examples from octopus arm, snake bellies, and spider webs, I will show how biological creatures have developed mechanically intelligent body forms, actuation strategies, and sensing modalities that enable their exceptional functionality and describe how our lab is working to translate these principles into new generations of soft robots."

- name: Ye (Sarah) Sun
  affiliation: University of Virginia
  website: https://engineering.virginia.edu/labs-groups/wearlab
  image: img/people/yesun.webp
  talk: "Flexible Wearable Electronics and Robotics: Towards Ubiquitous Monitoring and Assistance"
  abstract: "Wearable technologies offer the potential to bring continuous health monitoring and personalized physical assistance into everyday life. Realizing this potential requires systems that integrate comfortably with the human body, reliably interpret physiological and movement signals, and respond to users’ needs. The recent progress in smart fabrics, textiles, and garments and their manufacturing techniques has opened the door for next-generation wearable electronics with fully flexible systems on cloth. The controllable structures and the potential of automatic design-to-manufacturing translation of textile materials also inspire researchers to explore new textile actuators and create softer and more compliant wearable robotics. The first part of the talk will introduce textile electronics that transform everyday fabrics into functional platforms for sensing and human-robot interaction. A central focus is a programmable design-to-fabrication approach that translates electronic functions into machine-executable embroidery patterns, enabling the integration of conductive interconnects, electronic components, and sensors within textile structures. The second part will introduce a new class of wearable robots and soft exosuits for movement assistance, with an emphasis on understanding human motion intention and coordinating robotic support. EEG-based brain-computer interfaces will illustrate how neural signals can connect intended movement with wearable assistance."

