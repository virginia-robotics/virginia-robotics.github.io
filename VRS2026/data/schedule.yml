# a slot, replace `event` with `speaker`, matching a `name` in speakers.yml —
# the row then shows the speaker's name and talk title ("Title: TBD" until
# the speaker has a `talk` there):
# - time: "10:10 AM"
#   speaker: "Jane Doe"
#   place: "GLC"

