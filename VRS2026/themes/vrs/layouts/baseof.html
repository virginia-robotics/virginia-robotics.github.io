<!DOCTYPE html>
<html lang="{{ or site.Language.Lang "en" }}">
{{ partial "head.html" . }}
<body class="bg-white text-ink antialiased">
  {{ partial "header.html" . }}
  {{ block "main" . }}{{ end }}
  {{ partial "footer.html" . }}
  {{ with resources.Get "js/main.js" | minify | fingerprint }}
  <script src="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}" defer></script>
  {{ end }}
</body>
</html>
